[info]
relay_url = "ws://localhost:7777/"
name = "cvm-l402 dev relay"
description = "Local regtest relay for ContextVM L402 development"

[database]
data_directory = "/usr/src/app/db"

[network]
address = "0.0.0.0"
port = 8080

[limits]
messages_per_sec = 0
max_event_bytes = 262144
max_ws_message_bytes = 262144
max_ws_frame_bytes = 262144

[authorization]
nip42_auth = false
